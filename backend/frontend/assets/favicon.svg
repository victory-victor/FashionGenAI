<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a7cf8"/>
      <stop offset="50%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#3d82f6"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- App Icon Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Designer Clothes Hanger + Generative AI Spark -->
  <g filter="url(#shadow)">
    <!-- Hanger Hook -->
    <path d="M32 11.5 C35.5 11.5, 38.5 14, 38.5 17.5 C38.5 20.8, 35.8 23.2, 32.5 23.8 L32 25" 
          fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    
    <!-- Hanger Shoulders and Horizontal Bar -->
    <path d="M9.5 41.5 L32 24.5 L54.5 41.5 C55.5 42.2, 55 44, 53.5 44 L10.5 44 C9 44, 8.5 42.2, 9.5 41.5 Z" 
          fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Generative AI Sparkle Core in Center -->
    <path d="M32 30.5 Q32 35 36.5 35 Q32 35 32 39.5 Q32 35 27.5 35 Q32 35 32 30.5 Z" 
          fill="url(#sparkGrad)" stroke="#ffffff" stroke-width="0.5"/>
          
    <!-- Secondary small sparkle -->
    <circle cx="43" cy="27" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
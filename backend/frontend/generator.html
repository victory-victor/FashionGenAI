<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css"><title>Generator · FashionGen AI</title></head><body>
<div id="nav"></div>
<main class="wrap" style="padding-top:2.2rem">
  <h1 style="font-size:2.1rem">AI Image Generator</h1>
  <p class="sub">Describe what you want. The backend parses your text, generates images with the Conditional GAN and scores them with CLIP.</p>
  <div class="gen-layout">
    <form class="card" id="gen-form" novalidate>
      <div class="field"><label for="prompt">Your request</label>
        <textarea id="prompt" maxlength="300" placeholder="e.g. Show me four ankle boots">Show me four ankle boots</textarea></div>
      <div class="field"><label>Try an example</label><div class="chips" id="examples" style="margin-top:0"></div></div>
      <div class="row2 field">
        <div><label for="category">Category</label><select id="category"><option value="">Auto-detect from text</option></select></div>
        <div><label for="count">Images</label><select id="count"><option value="">Auto (from text)</option></select></div>
      </div>
      <p class="note" style="margin:0 0 1rem">Choosing a category or number overrides what the text says.</p>
      <button class="btn" id="gen-btn" type="submit" style="width:100%">Generate images</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <div>
      <div class="summary" id="summary"></div>
      <div id="bert-box"></div>
      <div id="results"><div class="empty">Your generated images will appear here.</div></div>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/main.js"></script><script src="js/generator.js"></script></body></html>
